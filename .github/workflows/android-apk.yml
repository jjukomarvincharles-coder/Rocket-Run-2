name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install dependencies
        run: npm install
      - name: Bundle Three.js locally (offline support)
        run: node scripts/vendor-three.js
      - name: Create Android project
        run: npx cap add android
      - name: Landscape + vibration permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:configChanges=/android:screenOrientation="sensorLandscape" android:configChanges=/' $M
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' $M
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rocket-run-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
